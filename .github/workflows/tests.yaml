name: Unit Tests
on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run unit tests ([${{ matrix.spark-extra }}])
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Mutually exclusive: [client] installs pyspark-client, [spark] full
        # pyspark[connect].
        spark-extra: ["client", "spark"]

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"

    - name: Cache pip dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ matrix.spark-extra }}-${{ hashFiles('setup.py', 'requirements-test.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ matrix.spark-extra }}-
          ${{ runner.os }}-pip-

    # Installs through the package's own extras, rather than
    # requirements-dev.txt (which pins pyspark-client), so that both extras are
    # exercised as users would install them.
    - name: Install dependencies
      run: |
        pip install -e '.[${{ matrix.spark-extra }},interactive]'
        pip install -r requirements-test.txt

    - name: Run unit tests
      run: python -m pytest tests/unit/ -v --tb=short -n auto

    # Starts Spark in-process, so it runs serially, outside of xdist. Needs
    # the JVM that only full pyspark ships.
    - name: Run local Spark tests
      if: matrix.spark-extra == 'spark'
      run: python -m pytest tests/local/ -v --tb=short
      env:
        JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}