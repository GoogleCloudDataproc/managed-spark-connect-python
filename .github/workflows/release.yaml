name: Release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to release (e.g. v2.0.1)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish to PyPI via OSS Exit Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.tag || github.ref }}
        persist-credentials: false

    - name: Setup Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.12"

    - name: Set up uv
      uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      with:
        enable-cache: false

    - name: Install build and upload dependencies
      run: uv pip install --system setuptools wheel build keyring twine keyrings.google-artifactregistry-auth

    - name: Build package
      run: |
        python3 -m build
        twine check dist/*

    - name: Authenticate to OSS Exit Gate
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
      with:
        workload_identity_provider: "projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github"

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

    - name: Clean up existing artifacts in Artifact Registry
      run: |
        gcloud artifacts packages delete google-cloud-spark-connect \
          --project=oss-exit-gate-prod \
          --repository=google-cloud-spark-connect--pypi \
          --location=us \
          --quiet || true

    - name: Upload package to Artifact Registry
      run: |
        twine upload \
          --repository-url https://us-python.pkg.dev/oss-exit-gate-prod/google-cloud-spark-connect--pypi \
          dist/*

    - name: Trigger OSS Exit Gate release
      run: |
        echo '{"publish_all": true}' > publish_all.json
        gcloud storage cp publish_all.json \
          gs://oss-exit-gate-prod-projects-bucket/google-cloud-spark-connect/pypi/manifests/publish_all.json
