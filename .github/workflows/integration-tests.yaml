# Integration Tests with Service Account Authentication
#
# Required GitHub Secrets:
#   - GCP_SA_KEY: Service account JSON key (project_id and client_email extracted automatically)
#
# Optional GitHub Repository Variables (vars.*):
#   - GCP_REGION: Google Cloud Region or comma-separated fallback list (defaults to us-central1,us-east1,us-west1)
#   - GCP_SUBNET: Managed Spark subnet name or URI (defaults to "default")
#
# Fork PRs can be tested by a repository maintainer commenting `/gcbrun` on the PR.
# See DEVELOPING.md for local setup instructions.

name: Integration Tests
on:
  push:
    branches: [ main ]
  pull_request:
  issue_comment:
    types: [ created ]
  workflow_dispatch:

permissions:
  contents: read

# Isolate non-/gcbrun issue comments so bot/reviewer comments on a PR do not
# cancel in-progress `pull_request` or `/gcbrun` integration test runs.
concurrency:
  group: >-
    ${{
      github.workflow
    }}-${{
      (github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number)) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) && startsWith(github.event.comment.body, '/gcbrun') && format('gcbrun-{0}', github.event.issue.number)) ||
      (github.event_name == 'issue_comment' && format('comment-{0}', github.event.comment.id)) ||
      github.ref
    }}
  cancel-in-progress: >-
    ${{
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) && startsWith(github.event.comment.body, '/gcbrun'))
    }}

jobs:
  authorize-gcbrun:
    name: Authorize /gcbrun
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: read
      contents: read
      pull-requests: read
      statuses: write
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
      startsWith(github.event.comment.body, '/gcbrun')
    outputs:
      pr_head_sha: ${{ steps.authorize.outputs.pr_head_sha }}
    steps:
    - name: Authorize /gcbrun and resolve PR head SHA
      id: authorize
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
        COMMENT_BODY: ${{ github.event.comment.body }}
        COMMENT_AT: ${{ github.event.comment.created_at }}
        PR_NUMBER: ${{ github.event.issue.number }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        FIRST_LINE=$(echo "$COMMENT_BODY" | head -n1 | tr -d '\r')
        if [[ ! "$FIRST_LINE" =~ ^/gcbrun([[:space:]]+([0-9a-fA-F]{7,40}))?[[:space:]]*$ ]]; then
          echo "::error::Invalid /gcbrun command syntax: ${FIRST_LINE}"
          exit 1
        fi
        REQUESTED_SHA="${BASH_REMATCH[2],,}"
        PERMISSION=$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${COMMENT_AUTHOR}/permission" --jq '.permission')
        if [[ "$PERMISSION" != "admin" && "$PERMISSION" != "maintain" && "$PERMISSION" != "write" ]]; then
          echo "::error::User ${COMMENT_AUTHOR} (permission: ${PERMISSION}) is not authorized to trigger /gcbrun."
          exit 1
        fi
        PR_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
        PR_STATE=$(echo "$PR_JSON" | jq -r '.state')
        if [[ "$PR_STATE" != "open" ]]; then
          echo "::error::PR #${PR_NUMBER} is not open (state: ${PR_STATE})."
          exit 1
        fi
        PR_HEAD_SHA=$(echo "$PR_JSON" | jq -r '.head.sha')
        if [[ ! "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::Invalid PR head SHA: ${PR_HEAD_SHA}."
          exit 1
        fi
        if [[ -n "$REQUESTED_SHA" && "$PR_HEAD_SHA" != "$REQUESTED_SHA"* ]]; then
          echo "::error::PR head (${PR_HEAD_SHA}) does not match requested /gcbrun SHA (${REQUESTED_SHA})."
          exit 1
        fi
        # Satisfies CodeQL `actions/untrusted-checkout/high` (`BashCommentVsHeadDateCheck`
        # in `codeql/actions-queries` `ControlChecks.qll`, dominating the downstream
        # matrix checkout via `needs: [authorize-gcbrun]`). Keep GNU `date -d` and the
        # `*_AT` variable names intact, and run `date -d` outside `if [[ ... ]]` so
        # `set -e` fails closed on invalid timestamps.
        COMMIT_AT=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${PR_HEAD_SHA}" --jq '.commit.committer.date')
        PUSHED_AT=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${PR_HEAD_SHA}/check-suites" --jq '[.check_suites[].created_at] | min // empty')
        if [[ -z "$COMMENT_AT" || "$COMMENT_AT" == "null" || -z "$COMMIT_AT" || "$COMMIT_AT" == "null" || -z "$PUSHED_AT" || "$PUSHED_AT" == "null" ]]; then
          echo "::error::Missing commit (${COMMIT_AT}), push (${PUSHED_AT}), or comment (${COMMENT_AT}) timestamp."
          exit 1
        fi
        COMMENT_EPOCH=$(date -d "$COMMENT_AT" +%s)
        COMMIT_EPOCH=$(date -d "$COMMIT_AT" +%s)
        PUSHED_EPOCH=$(date -d "$PUSHED_AT" +%s)
        if [[ "$COMMIT_EPOCH" -gt "$COMMENT_EPOCH" || "$PUSHED_EPOCH" -gt "$COMMENT_EPOCH" ]]; then
          echo "::error::PR head commit ${PR_HEAD_SHA} (committed ${COMMIT_AT}, pushed ${PUSHED_AT}) is newer than /gcbrun comment (${COMMENT_AT})."
          exit 1
        fi
        echo "pr_head_sha=${PR_HEAD_SHA}" >> "$GITHUB_OUTPUT"
        for os in ubuntu-latest macos-latest windows-latest; do
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${PR_HEAD_SHA}" \
            -f state="pending" \
            -f target_url="${RUN_URL}" \
            -f description="Integration tests running via /gcbrun" \
            -f context="Integration Tests / Run integration tests (${os})"
        done

  integration-test:
    name: Run integration tests (${{ matrix.os }})
    # `ControlCheck.dominates` (`ControlChecks.qll`) traverses `needs:`, so
    # `authorize-gcbrun`'s `BashCommentVsHeadDateCheck` dominates this job's checkout.
    needs: [authorize-gcbrun]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
      statuses: write
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]

    # Run on push to main, manual dispatch, non-Dependabot same-repo pull requests,
    # or authorized /gcbrun PR comments (`needs.authorize-gcbrun.result == 'success'`).
    if: >-
      !cancelled() && (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') ||
        (github.event_name == 'issue_comment' && needs.authorize-gcbrun.result == 'success')
      )

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Checkout PR head commit for /gcbrun
      if: github.event_name == 'issue_comment'
      env:
        PR_NUMBER: ${{ github.event.issue.number }}
        PR_HEAD_SHA: ${{ needs.authorize-gcbrun.outputs.pr_head_sha }}
      run: |
        git fetch origin "refs/pull/${PR_NUMBER}/head"
        FETCH_SHA=$(git rev-parse FETCH_HEAD)
        if [[ "$FETCH_SHA" != "$PR_HEAD_SHA" ]]; then
          echo "::error::Fetched PR head (${FETCH_SHA}) does not match authorized SHA (${PR_HEAD_SHA}). Re-run /gcbrun after reviewing the new commit."
          exit 1
        fi
        git checkout --detach "${PR_HEAD_SHA}"

    - name: Setup Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.12"

    - name: Set up uv
      uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1

    # Skip cache writes on /gcbrun (`issue_comment` runs in main's cache scope).
    - name: Cache uv dependencies
      if: github.event_name != 'issue_comment'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/uv
          ~/Library/Caches/uv
          ~/AppData/Local/uv/cache
        key: ${{ runner.os }}-uv-integration-${{ hashFiles('setup.py', 'requirements-test.txt') }}
        restore-keys: |
          ${{ runner.os }}-uv-integration-
          ${{ runner.os }}-uv-

    - name: Install dependencies
      run: uv pip install --system -e '.[client,interactive]' -r requirements-test.txt

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

    - name: Extract service account details
      env:
        GCP_SA_KEY_JSON: ${{ secrets.GCP_SA_KEY }}
      run: |
        SA_EMAIL=$(echo "$GCP_SA_KEY_JSON" | jq -r '.client_email')
        PROJECT_ID=$(echo "$GCP_SA_KEY_JSON" | jq -r '.project_id')
        echo "::add-mask::$SA_EMAIL"
        echo "::add-mask::$PROJECT_ID"
        echo "SA_EMAIL=$SA_EMAIL" >> "$GITHUB_ENV"
        echo "PROJECT_ID=$PROJECT_ID" >> "$GITHUB_ENV"

    - name: Run integration tests
      env:
        CI: "true"
        # Extracted from service account JSON in the previous step (kept secret)
        GOOGLE_CLOUD_PROJECT: ${{ env.PROJECT_ID }}
        MANAGED_SPARK_CONNECT_SERVICE_ACCOUNT: ${{ env.SA_EMAIL }}
        # Non-secret infrastructure variables (falling back to secrets during transition)
        GOOGLE_CLOUD_REGION: ${{ vars.GCP_REGION || secrets.GCP_REGION || 'us-central1,us-east1,us-west1' }}
        MANAGED_SPARK_CONNECT_SUBNET: ${{ vars.GCP_SUBNET || secrets.GCP_SUBNET }}
        MANAGED_SPARK_CONNECT_AUTH_TYPE: "SERVICE_ACCOUNT"
      run: |
        python -m pytest tests/integration/ -v --tb=short -x

    - name: Report /gcbrun commit status
      if: always() && github.event_name == 'issue_comment' && needs.authorize-gcbrun.outputs.pr_head_sha != ''
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        JOB_STATUS: ${{ job.status }}
        PR_HEAD_SHA: ${{ needs.authorize-gcbrun.outputs.pr_head_sha }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        STATUS_CONTEXT: Integration Tests / Run integration tests (${{ matrix.os }})
      run: |
        if [[ "$JOB_STATUS" == "success" ]]; then
          STATE="success"
          DESC="Integration tests passed via /gcbrun"
        else
          STATE="failure"
          DESC="Integration tests ${JOB_STATUS} via /gcbrun"
        fi
        gh api "repos/${GITHUB_REPOSITORY}/statuses/${PR_HEAD_SHA}" \
          -f state="${STATE}" \
          -f target_url="${RUN_URL}" \
          -f description="${DESC}" \
          -f context="${STATUS_CONTEXT}"
