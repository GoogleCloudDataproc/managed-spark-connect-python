[build-system]
requires = ["setuptools>=72.0"]
build-backend = "setuptools.build_meta"

[tool.pyink]
line-length = 80  # (default is 88)
pyink-indentation = 4 #  (default is 4)

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests",
    "ci_safe: marks tests that work in CI environment",
    "slow: marks unit tests that take a second or more, mostly waiting; the smoke tests skip them",
]
